<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presence Studio</title><link rel="stylesheet" href="popup.css"><script defer src="popup.js"></script></head>
<body><header><img src="icons/48.png" width="40" height="40" alt=""><div><strong>Presence Studio</strong><small id="version"></small></div><button id="language" type="button">한국어</button></header>
<main><span id="status" role="status"></span><h1 data-text="title">Connect your activity</h1><p data-text="intro"></p>
<form id="pairForm"><label for="code" data-text="codeLabel"></label><input id="code" autocomplete="off" spellcheck="false" maxlength="20" placeholder="ABCD-1234-EF56" required><button id="connect" type="submit" data-text="connect"></button></form>
<p id="message" role="status"></p><button id="openApp" type="button" class="secondary" data-text="openApp"></button><button id="disconnect" type="button" class="text" data-text="disconnect" hidden></button>
<p class="note" data-text="permission"></p><p class="note" data-text="refresh"></p>
<footer><a href="https://github.com/LUNA12379/presence-studio-releases/releases/latest" target="_blank" rel="noreferrer" data-text="download"></a><a href="https://github.com/LUNA12379/presence-studio-releases/blob/main/PRIVACY.md" target="_blank" rel="noreferrer" data-text="privacy"></a></footer></main></body></html>
